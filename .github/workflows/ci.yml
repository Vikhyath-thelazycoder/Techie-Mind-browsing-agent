name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint (ESLint + Prettier)
        run: |
          npm run lint
          npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build Chrome + Firefox
        run: npm run build

      - name: Firefox manifest lint (web-ext)
        run: npm run lint:firefox

      - name: Install Chromium for real-browser tests
        run: npx playwright install --with-deps chromium

      - name: Real-browser extension tests
        run: npm run test:browser

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence
          path: test-results/
          if-no-files-found: ignore
